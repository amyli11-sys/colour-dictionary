const GROUPS = ["Reds","Pinks","Oranges & browns","Yellows","Greens","Blues","Purples","Neutrals"];

const app = document.getElementById('app');

function renderStep1(){
  app.innerHTML = '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;" id="groupGrid"></div>';
  const grid = document.getElementById('groupGrid');
  GROUPS.forEach(g => {
    const count = DATA.filter(c => c.g === g).length;
    const card = document.createElement('button');
    card.style.cssText = 'display:flex;flex-direction:column;align-items:flex-start;padding:0;overflow:hidden;text-align:left;background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;';

      '<div style="width:100%;height:48px;background:' + GROUP_SWATCH[g] + ';"></div>' +
      '<div style="padding:10px 12px;">' +
        '<div style="font-size:14px;font-weight:500;">' + g + '</div>' +
        '<div style="font-size:11px;color:var(--text-muted);">' + count + ' shades</div>' +
      '</div>';
    card.onclick = function(){ renderStep2(g); };
    grid.appendChild(card);
  });
}

  swatches.forEach(c => {
    const card = document.createElement('button');
    card.style.cssText = 'display:flex;flex-direction:column;align-items:flex-start;padding:0;overflow:hidden;text-align:left;background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;';
    card.innerHTML =
      '<div style="width:100%;height:48px;background:' + c.h + ';"></div>' +
      '<div style="padding:8px 10px;">' +
        '<div style="font-size:13px;font-weight:500;">' + c.n + '</div>' +
        '<div style="font-size:11px;color:var(--text-muted);">' + c.c.length + ' combination' + (c.c.length===1?'':'s') + '</div>' +
      '</div>';
    card.onclick = function(){ renderStep3(c.i, group); };
    grid.appendChild(card);
  });
}

function renderStep3(idx, group){
  const base = DATA[idx];
  const combos = base.c.slice().sort(function(a,b){return a-b;}).map(function(id){
    const members = DATA.filter(function(c){ return c.c.indexOf(id) !== -1 && c.i !== idx; });
    return {id: id, members: members};
  });
  app.innerHTML =
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:0.75rem;">' +
      '<button id="backBtn2" style="padding:6px 12px;font-size:13px;">&larr; ' + group + '</button>' +
    '</div>' +
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:1rem;">' +
      '<div style="width:32px;height:32px;border-radius:8px;background:' + base.h + ';border:0.5px solid var(--border);flex-shrink:0;"></div>' +
      '<div>' +
        '<div style="font-size:15px;font-weight:500;">' + base.n + '</div>' +
        '<div style="font-size:12px;color:var(--text-muted);">' + combos.length + ' combination' + (combos.length===1?'':'s') + ' in the book</div>' +
      '</div>' +
    '</div>' +
    '<div id="comboList" style="display:flex;flex-direction:column;gap:14px;"></div>' +
    '<button id="restartBtn" style="width:100%;margin-top:1rem;padding:10px;">Start over</button>';
  document.getElementById('backBtn2').onclick = function(){ renderStep2(group); };
  document.getElementById('restartBtn').onclick = renderStep1;
  const list = document.getElementById('comboList');
  combos.forEach(function(combo){
    const row = document.createElement('div');
    row.style.cssText = 'background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:12px;';
    const allMembers = [base].concat(combo.members);
    const swatches = allMembers.map(function(m){
      return '<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;">' +
        '<div style="width:100%;height:64px;border-radius:8px;background:' + m.h + ';border:0.5px solid var(--border);' + (m.i===idx?'box-shadow:0 0 0 2px var(--border-accent);':'') + '"></div>' +
        '<span style="font-size:11px;text-align:center;line-height:1.25;' + (m.i===idx?'font-weight:500;':'color:var(--text-secondary);') + '">' + m.n + '</span>' +
      '</div>';
    }).join('');
    row.innerHTML =
      '<div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">combination ' + combo.id + '</div>' +
      '<div style="display:flex;gap:8px;">' + swatches + '</div>';
    list.appendChild(row);
  });
}

renderStep1();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
